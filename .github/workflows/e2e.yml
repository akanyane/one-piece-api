name: e2e

# Contract tests against a live deployment (real database and CDN).
on:
  # After every successful production deployment from Vercel.
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment to test"
        default: "https://www.onepieceapi.com"
        required: true

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
        env:
          # Production is always tested on the public domain: Vercel's
          # per-deployment URLs sit behind deployment protection.
          API_BASE_URL: ${{ inputs.base_url || 'https://www.onepieceapi.com' }}
